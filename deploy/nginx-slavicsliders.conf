# Slavic Sliders — Nginx site for workhorse
# Install:
#   sudo cp deploy/nginx-slavicsliders.conf /etc/nginx/sites-available/slavicsliders
#   sudo ln -s /etc/nginx/sites-available/slavicsliders /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d slavicsliders.com -d www.slavicsliders.com
# Replace slavicsliders.com below with your real domain first.

server {
    listen 80;
    listen [::]:80;
    server_name slavicsliders.com www.slavicsliders.com;

    # Photo uploads from the admin panel (iPhone photos can be large)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
